<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر کلاسی</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial,sans-serif}
header{background:#172033;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px} header p{margin:6px 0 0;opacity:.75;font-size:13px}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:76px;z-index:4}
nav button{white-space:nowrap;border:1px solid #d9deea;background:#fff;border-radius:12px;padding:9px 13px;font-size:13px}
nav button.active{background:#172033;color:#fff;border-color:#172033}
main{max-width:900px;margin:auto;padding:14px}
section{display:none}.show{display:block}
.card{background:#fff;border:1px solid #e5e8ef;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}
h2{font-size:19px;margin:0 0 12px}.muted{color:#667085;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
label{font-size:12px;color:#667085;display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d8ddea;border-radius:10px;padding:10px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}
button.primary{background:#172033;color:white;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
button.secondary{background:#eef1f6;color:#172033;border:0;border-radius:10px;padding:10px 14px;font:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.table{overflow:auto}.schedule{min-width:620px;display:grid;grid-template-columns:120px repeat(3,1fr);border:1px solid #e1e5ed;border-radius:12px;overflow:hidden}
.cell{padding:10px;border-left:1px solid #e1e5ed;border-bottom:1px solid #e1e5ed;background:#fff}.head{background:#f0f3f8;font-weight:bold}.day{font-weight:bold;background:#f8f9fc}
.student{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f5}.student:last-child{border-bottom:0}
.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#eef1f6}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.progress-item{border:1px solid #e2e6ee;border-radius:12px;padding:12px;margin-top:10px}
small{color:#667085}.danger{color:#b42318}.empty{text-align:center;padding:30px;color:#667085}
</style>
</head>
<body>
<header><h1>📚 دفتر کلاسی</h1><p>دفتر دیجیتال معلم • پایه چهارم</p></header>
<nav id="nav">
<button class="active" data-tab="home">خانه</button><button data-tab="students">دانش‌آموزان</button>
<button data-tab="schedule">برنامه کلاسی</button><button data-tab="progress">پیشرفت تدریس</button>
</nav>
<main>
<section id="home" class="show">
<div class="card"><h2>خوش آمدید 👋</h2><p class="muted">از اینجا می‌توانی دانش‌آموزان، برنامه هفتگی و پیشرفت تدریس را مدیریت کنی.</p>
<div class="grid"><div class="card"><b>۱۶</b><br><small>دانش‌آموز</small></div><div class="card"><b>۵</b><br><small>درس</small></div><div class="card"><b>۱۵</b><br><small>زنگ هفتگی</small></div></div></div>
</section>
<section id="students"><div class="card"><h2>دانش‌آموزان</h2><input id="studentSearch" placeholder="جستجوی نام..."><div id="studentList"></div></div></section>
<section id="schedule"><div class="card"><h2>برنامه کلاسی</h2><p class="muted">پنجشنبه و جمعه در برنامه وجود ندارند. درس هر زنگ را خودت انتخاب کن.</p><div class="table"><div id="scheduleGrid" class="schedule"></div></div><div class="actions"><button class="primary" onclick="saveSchedule()">ذخیره برنامه</button><button class="secondary" onclick="resetSchedule()">بازنشانی</button></div></div></section>
<section id="progress"><div class="card"><h2>ثبت پیشرفت تدریس</h2><div class="row"><div><label>تاریخ شمسی</label><input id="pDate" placeholder="مثلاً ۱۴۰۵/۰۷/۰۶"></div><div><label>درس</label><select id="pSubject"></select></div></div>
<div style="margin-top:10px"><label>تا کدام صفحه / درس / مبحث پیش رفت؟</label><input id="pPage"></div>
<div style="margin-top:10px"><label>موضوع تدریس‌شده</label><input id="pTopic"></div>
<div style="margin-top:10px"><label>فعالیت‌های انجام‌شده در کلاس</label><textarea id="pActivity"></textarea></div>
<div style="margin-top:10px"><label>تکلیف داده‌شده</label><textarea id="pHomework"></textarea></div>
<div style="margin-top:10px"><label>یادداشت معلم</label><textarea id="pNote"></textarea></div>
<div class="actions"><button class="primary" onclick="addProgress()">ثبت پیشرفت</button></div></div>
<div class="card"><h2>سوابق پیشرفت</h2><div class="row"><input id="filterText" placeholder="جستجو..."><select id="filterSubject"></select></div><div id="progressList"></div></div></section>
</main>
<script>
const subjects=['ریاضی','فارسی','علوم','مطالعات اجتماعی','هدیه‌های آسمانی'];
const students=['سهما دریایی صلعی','فریجا زارع','کوثر سهیلی‌زاده','مریم گندمی','منا ملاحي','سما نجانی‌زاده','مونا یوسفی','نسیم آتش‌روز','هدا آسوده','نهال ارزنگ','مریم برخاسته','رهاب جاسمی','سدنیا جاشوئی','عذرا جاشوئی خمیری','مطهره خوش‌دل','فاطمه دربخش'];
const days=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه'];
let schedule=JSON.parse(localStorage.getItem('classSchedule')||'null')||Object.fromEntries(days.map(d=>[d,['','','']]));
let progress=JSON.parse(localStorage.getItem('classProgress')||'[]');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section').forEach(s=>s.classList.remove('show'));document.getElementById(b.dataset.tab).classList.add('show')});
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderStudents(q=''){let a=students.filter(x=>x.includes(q));document.getElementById('studentList').innerHTML=a.map((x,i)=>`<div class="student"><span>${esc(x)}</span><span class="badge">پایه چهارم</span></div>`).join('')||'<div class="empty">دانش‌آموزی پیدا نشد.</div>'}
document.getElementById('studentSearch').oninput=e=>renderStudents(e.target.value);
function renderSchedule(){let g=document.getElementById('scheduleGrid');g.innerHTML='<div class="cell head">روز</div><div class="cell head">زنگ ۱</div><div class="cell head">زنگ ۲</div><div class="cell head">زنگ ۳</div>';days.forEach(d=>{g.innerHTML+=`<div class="cell day">${d}</div>`+schedule[d].map((v,i)=>`<div class="cell"><select data-day="${d}" data-i="${i}"><option value="">انتخاب درس</option>${subjects.map(s=>`<option ${s===v?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')})}
function saveSchedule(){document.querySelectorAll('#scheduleGrid select').forEach(s=>schedule[s.dataset.day][s.dataset.i]=s.value);localStorage.setItem('classSchedule',JSON.stringify(schedule));alert('برنامه ذخیره شد ✅')}
function resetSchedule(){schedule=Object.fromEntries(days.map(d=>[d,['','','']]));renderSchedule();saveSchedule()}
function fillSubjects(){document.getElementById('pSubject').innerHTML=subjects.map(s=>`<option>${s}</option>`).join('');document.getElementById('filterSubject').innerHTML='<option value="">همه درس‌ها</option>'+subjects.map(s=>`<option>${s}</option>`).join('')}
function addProgress(){let x={id:Date.now(),date:pDate.value.trim(),subject:pSubject.value,page:pPage.value.trim(),topic:pTopic.value.trim(),activity:pActivity.value.trim(),homework:pHomework.value.trim(),note:pNote.value.trim()};if(!x.date||!x.topic){alert('تاریخ و موضوع تدریس را وارد کن.');return}progress.unshift(x);localStorage.setItem('classProgress',JSON.stringify(progress));['pPage','pTopic','pActivity','pHomework','pNote'].forEach(id=>document.getElementById(id).value='');renderProgress();alert('پیشرفت ثبت شد ✅')}
function renderProgress(){let q=document.getElementById('filterText').value.trim(),f=document.getElementById('filterSubject').value;let a=progress.filter(x=>(!f||x.subject===f)&&(!q||Object.values(x).join(' ').includes(q)));document.getElementById('progressList').innerHTML=a.length?a.map(x=>`<div class="progress-item"><b>${esc(x.subject)}</b> • ${esc(x.date)}<br><small>پیشرفت: ${esc(x.page||'—')}</small><p>${esc(x.topic)}</p>${x.activity?`<small>فعالیت: ${esc(x.activity)}</small><br>`:''}${x.homework?`<small>تکلیف: ${esc(x.homework)}</small><br>`:''}${x.note?`<small>یادداشت: ${esc(x.note)}</small>`:''}<div class="actions"><button class="secondary" onclick="delProgress(${x.id})">حذف</button></div></div>`).join(''):'<div class="empty">هنوز سابقه‌ای ثبت نشده.</div>'}
function delProgress(id){progress=progress.filter(x=>x.id!==id);localStorage.setItem('classProgress',JSON.stringify(progress));renderProgress()}
document.getElementById('filterText').oninput=renderProgress;document.getElementById('filterSubject').onchange=renderProgress;
renderStudents();renderSchedule();fillSubjects();renderProgress();
</script>
</body></html>
